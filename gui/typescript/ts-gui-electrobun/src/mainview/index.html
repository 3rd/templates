<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ts-gui-electrobun</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f2ee;
        --surface: #fff;
        --border: #d6d6cf;
        --text: #1c1c18;
        --muted: #5c5c55;
        --accent: #3d4e8c;
        --accent-soft: #e6e9f4;
        --header: #ecece6;
        --status: #e7e7e1;
        font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; min-height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--text); }
      .shell { display: flex; flex-direction: column; height: 100%; min-height: 100%; }
      .header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; background: var(--header); border-bottom: 1px solid var(--border);
      }
      .header h1 { margin: 0; font-size: 18px; font-weight: 650; }
      .lede { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      .badge {
        border: 1px solid var(--border); background: var(--surface); color: var(--muted);
        font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px;
      }
      .tabs {
        display: flex; gap: 4px; padding: 8px 12px 0;
        border-bottom: 1px solid var(--border); background: var(--bg);
      }
      .tabs button {
        appearance: none; border: 1px solid transparent; border-bottom: none;
        background: transparent; color: var(--muted); padding: 8px 14px;
        border-radius: 6px 6px 0 0; cursor: pointer; font: inherit;
      }
      .tabs button[aria-selected="true"] {
        background: var(--surface); color: var(--text); border-color: var(--border); font-weight: 600;
      }
      .content { flex: 1; overflow: auto; background: var(--surface); padding: 20px 24px; }
      .content h2 { margin: 0 0 8px; font-size: 16px; }
      .content p { margin: 0 0 12px; }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      .content button {
        appearance: none; border: 1px solid var(--border); background: var(--accent-soft);
        color: var(--accent); padding: 6px 12px; border-radius: 6px; cursor: pointer;
        font: inherit; font-weight: 600;
      }
      .field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; color: var(--muted); font-size: 12px; }
      .field input {
        border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px;
        font: inherit; color: var(--text); background: var(--bg);
      }
      .check { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
      .status {
        padding: 8px 16px; background: var(--status); border-top: 1px solid var(--border);
        color: var(--muted); font-size: 12px;
      }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div>
          <h1>ts-gui-electrobun</h1>
          <p class="lede">Starter workspace</p>
        </div>
        <span class="badge">starter</span>
      </header>
      <nav class="tabs" role="tablist" aria-label="Workspace">
        <button id="tab-home" type="button" role="tab" aria-controls="panel-home" aria-selected="true" tabindex="0">Home</button>
        <button id="tab-notes" type="button" role="tab" aria-controls="panel-notes" aria-selected="false" tabindex="-1">Notes</button>
        <button id="tab-settings" type="button" role="tab" aria-controls="panel-settings" aria-selected="false" tabindex="-1">Settings</button>
      </nav>
      <main class="content">
        <section id="panel-home" role="tabpanel" aria-labelledby="tab-home">
          <h2>Home</h2>
          <p>A desktop shell with tabs, a content pane, and a few working controls.</p>
          <p>Count: <span id="count">0</span></p>
          <div class="controls">
            <button id="increment" type="button">Increment</button>
            <button id="reset" type="button">Reset</button>
          </div>
        </section>
        <section id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" class="hidden">
          <h2>Notes</h2>
          <label class="field">
            Note
            <input id="note" type="text" placeholder="Write a note" />
          </label>
          <p id="preview">Preview: (empty)</p>
          <div class="controls">
            <button id="clear" type="button">Clear</button>
          </div>
        </section>
        <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" class="hidden">
          <h2>Settings</h2>
          <label class="check">
            <input id="notifications" type="checkbox" checked />
            Notifications
          </label>
          <label class="field">
            Display name
            <input id="display-name" type="text" value="ts-gui-electrobun" />
          </label>
          <div class="controls">
            <button id="apply" type="button">Apply</button>
          </div>
        </section>
      </main>
      <footer class="status" id="status">Home · Count 0</footer>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
